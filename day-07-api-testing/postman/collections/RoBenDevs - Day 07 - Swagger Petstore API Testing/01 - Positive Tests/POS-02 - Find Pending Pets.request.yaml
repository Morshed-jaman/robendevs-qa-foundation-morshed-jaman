$kind: http-request
url: https://petstore.swagger.io/v2/pet/findByStatus?status=pending
method: GET
queryParams:
  status: pending
scripts:
  - type: afterResponse
    code: "\r

      pm.test(\"Status code is 200\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      pm.test(\"Response is a JSON array\", function () {\r

      \    pm.expect(pm.response.json()).to.be.an(\"array\");\r

      });\r

      \r

      pm.test(\"All returned pets are pending\", function () {\r

      \    const pets = pm.response.json();\r

      \r

      \    pets.forEach(function (pet) {\r

      \        pm.expect(pet.status).to.eql(\"pending\");\r

      \    });\r

      });\r\n"
    language: text/javascript
order: 2000
