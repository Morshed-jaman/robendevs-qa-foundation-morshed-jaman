$kind: http-request
url: https://petstore.swagger.io/v2/pet/202611160803
method: GET
scripts:
  - type: afterResponse
    code: "\r

      pm.test(\"Status code is 200\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      pm.test(\"Response is JSON\", function () {\r

      \    pm.response.to.be.json;\r

      });\r

      \r

      pm.test(\"Retrieved pet matches created pet\", function () {\r

      \    const pet = pm.response.json();\r

      \r

      \    pm.expect(pet.id).to.eql(202611160803);\r

      \    pm.expect(pet.name).to.eql(\"RoBenDevs QA Test Pet\");\r

      \    pm.expect(pet.status).to.eql(\"available\");\r

      });\r\n"
    language: text/javascript
order: 4000
