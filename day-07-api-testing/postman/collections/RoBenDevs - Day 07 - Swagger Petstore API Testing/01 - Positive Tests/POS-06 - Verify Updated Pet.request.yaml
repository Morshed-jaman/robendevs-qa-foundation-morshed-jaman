$kind: http-request
url: https://petstore.swagger.io/v2/pet/202611160803
method: GET
scripts:
  - type: afterResponse
    code: "\r

      pm.test(\"Status code is 200\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      pm.test(\"Updated pet name is saved\", function () {\r

      \    const pet = pm.response.json();\r

      \    pm.expect(pet.name).to.eql(\"RoBenDevs QA Updated Pet\");\r

      });\r

      \r

      pm.test(\"Updated status is sold\", function () {\r

      \    const pet = pm.response.json();\r

      \    pm.expect(pet.status).to.eql(\"sold\");\r

      });\r\n"
    language: text/javascript
order: 6000
