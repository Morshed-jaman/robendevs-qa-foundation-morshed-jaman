$kind: http-request
url: https://petstore.swagger.io/v2/store/inventory
method: GET
headers:
  api_key: special-key
  Accept: application/json
scripts:
  - type: afterResponse
    code: "\r

      pm.test(\"Inventory request succeeds\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      pm.test(\"Response is valid JSON\", function () {\r

      \    pm.response.to.be.json;\r

      });\r

      \r

      pm.test(\"Inventory contains numeric quantities\", function () {\r

      \    const inventory = pm.response.json();\r

      \r

      \    pm.expect(inventory).to.be.an(\"object\");\r

      \r

      \    Object.values(inventory).forEach(function (quantity) {\r

      \        pm.expect(quantity).to.be.a(\"number\");\r

      \    });\r

      });\r\n"
    language: text/javascript
order: 8000
