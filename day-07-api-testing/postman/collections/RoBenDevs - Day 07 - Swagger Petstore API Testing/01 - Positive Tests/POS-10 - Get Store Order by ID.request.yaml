$kind: http-request
url: https://petstore.swagger.io/v2/store/order/2026111609
method: GET
scripts:
  - type: afterResponse
    code: "\r

      pm.test(\"Order retrieval succeeds\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      pm.test(\"Response is valid JSON\", function () {\r

      \    pm.response.to.be.json;\r

      });\r

      \r

      pm.test(\"Retrieved order matches created order\", function () {\r

      \    const order = pm.response.json();\r

      \r

      \    pm.expect(order.id).to.eql(2026111609);\r

      \    pm.expect(order.quantity).to.eql(1);\r

      \    pm.expect(order.status).to.eql(\"placed\");\r

      \    pm.expect(order.complete).to.eql(false);\r

      });\r\n"
    language: text/javascript
order: 10000
