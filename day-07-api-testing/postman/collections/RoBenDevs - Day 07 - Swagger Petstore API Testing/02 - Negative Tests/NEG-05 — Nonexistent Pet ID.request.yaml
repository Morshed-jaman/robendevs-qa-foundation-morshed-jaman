$kind: http-request
url: https://petstore.swagger.io/v2/pet/999999999999999
method: GET
scripts:
  - type: afterResponse
    code: "\r

      pm.test(\"Nonexistent pet returns 404\", function () {\r

      \    pm.response.to.have.status(404);\r

      });\r

      \r

      pm.test(\"Response indicates missing pet\", function () {\r

      \    const data = pm.response.json();\r

      \r

      \    pm.expect(data.message).to.be.a(\"string\");\r

      \    pm.expect(data.message.toLowerCase())\r

      \      .to.include(\"not found\");\r

      });\r\n"
    language: text/javascript
order: 5000
