$kind: http-request
url: https://petstore.swagger.io/v2/store/inventory
method: GET
headers:
  api_key: invalid-test-key
scripts:
  - type: afterResponse
    code: "\r

      pm.test(\"Invalid API key should be rejected\", function () {\r

      \    pm.expect(pm.response.code).to.be.oneOf([401, 403]);\r

      });\r

      \r

      pm.test(\"Actual response status is recorded\", function () {\r

      \    console.log(\"HTTP status:\", pm.response.code);\r

      \    pm.expect(pm.response.code).to.be.a(\"number\");\r

      });\r\n"
    language: text/javascript
order: 7000
