$kind: http-request
url: https://petstore.swagger.io/v2/pet/findByStatus?status={{status}}
method: GET
queryParams:
  status: "{{status}}"
scripts:
  - type: afterResponse
    code: "\r

      const status = pm.iterationData.get(\"status\");\r

      const expectedCode = Number(\r

      \    pm.iterationData.get(\"expectedCode\")\r

      );\r

      \r

      // Test 1: Verify HTTP status code\r

      pm.test(`Status code is ${expectedCode}`, function () {\r

      \    pm.response.to.have.status(expectedCode);\r

      });\r

      \r

      // Test 2: Verify JSON array response\r

      pm.test(`Response is an array for ${status}`, function () {\r

      \    const pets = pm.response.json();\r

      \    pm.expect(pets).to.be.an(\"array\");\r

      });\r

      \r

      // Test 3: Verify each returned pet status\r

      pm.test(`All returned pets have status ${status}`, function () {\r

      \    const pets = pm.response.json();\r

      \r

      \    pm.expect(pets).to.be.an(\"array\");\r

      \r

      \    pets.forEach(function (pet) {\r

      \        pm.expect(pet.status).to.eql(status);\r

      \    });\r

      });\r\n"
    language: text/javascript
order: 1000
