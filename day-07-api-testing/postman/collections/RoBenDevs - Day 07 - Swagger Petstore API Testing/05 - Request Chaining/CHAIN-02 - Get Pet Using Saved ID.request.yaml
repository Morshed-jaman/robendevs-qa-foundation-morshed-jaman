$kind: http-request
url: https://petstore.swagger.io/v2/pet/{{day08PetId}}
method: GET
scripts:
  - type: afterResponse
    code: "\r

      pm.test(\"Pet retrieved successfully\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      pm.test(\"Retrieved pet matches saved ID\", function () {\r

      \    const pet = pm.response.json();\r

      \r

      \    pm.expect(pet.id).to.eql(\r

      \        Number(pm.collectionVariables.get(\"day08PetId\"))\r

      \    );\r

      \r

      \    pm.expect(pet.name).to.eql(\"Day 08 Chained Pet\");\r

      });\r\n"
    language: text/javascript
order: 2000
