
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sample CRM Login</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 420px;
      margin: 60px auto;
      padding: 20px;
    }
    input {
      display: block;
      margin: 12px 0;
      padding: 10px;
    }
    .hint {
      color: #dddddd;
      background: white;
    }
  </style>
</head>
<body>
  <h1>Sample CRM Login</h1>

  <input type="email" placeholder="Email">
  <input type="password" placeholder="Password">

  <button type="button">Login</button>

  <p class="hint">Please enter your credentials.</p>
</body>
</html>
